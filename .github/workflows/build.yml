name: Build game

# - every push to main: builds the Windows game and uploads it as a workflow artifact
# - pushing a tag like v0.2.0: also publishes a GitHub Release with the zip attached
# - "Run workflow" button in the Actions tab: manual build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: pytest

      - name: Build with PyInstaller
        run: pyinstaller afterdeath.spec --noconfirm

      - name: Package zip
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "build-${{ github.run_number }}" }
          $zip = "Afterdeath-$version-windows.zip"
          Compress-Archive -Path dist/Afterdeath -DestinationPath $zip
          "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Afterdeath-windows
          path: ${{ env.ZIP_NAME }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Afterdeath ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
